<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCJEditor — Canlı Kod Editör</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data: blob:; font-src data:; frame-src about:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #eee;
      }

      /* Html - Css - Js textarea larımızın bulunduğu kısım */
      #editor-container {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        background-color: #1e1e1e;
        height: 200px;
      }

      .editor {
        flex: 1 1 30%;
        margin: 0 6px;
        display: flex;
        flex-direction: column;
        background-color: #222;
        border-radius: 6px;
        overflow: hidden;
      }

      .editor h3 {
        margin: 0;
        padding: 6px;
        background-color: #333;
        color: #ccc;
        font-size: 14px;
        text-align: center;
        border-bottom: 1px solid #444;
      }

      textarea {
        width: 100%;
        height: 140px;
        resize: none;
        overflow-y: auto;
        font-family: monospace;
        font-size: 14px;
        padding: 8px;
        border: none;
        background-color: #111;
        color: #eee;
        box-sizing: border-box;
      }

      /* Önizleme Kısmı*/
      #preview-container {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(100vh - 200px);
        background-color: #fff;
        border-top: 2px solid #444;
      }

      #preview {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Buton */
      button {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: gray;
        color: white;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.3s ease;
        z-index: 1001;
      }

      /* Footer stili */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #333;
        color: #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        z-index: 1000;
      }

      #load-btn {
        margin-left: 0;
      }

      #save-btn {
        margin-right: 0;
      }

      button:hover {
        transform: scale(1.2);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      /* Fit the unchanged three-pane interface inside a bounded portfolio iframe. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        grid-template-rows: minmax(140px, 36%) minmax(0, 1fr) 70px;
        overflow: hidden;
      }
      #editor-container {
        height: auto;
        min-width: 0;
      }
      .editor {
        min-width: 0;
        min-height: 0;
      }
      textarea {
        flex: 1;
        min-height: 0;
      }
      #preview-container {
        position: static;
        height: auto;
        min-height: 0;
      }
      footer {
        position: relative;
        gap: 12px;
      }
      #file-notice {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 12px;
        max-width: min(320px, calc(100% - 24px));
        margin: 0;
        padding: 8px 12px;
        border: 1px solid #666;
        border-radius: 6px;
        background: #222;
        color: #eee;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 2px 5px rgb(0 0 0 / 30%);
      }
      #file-notice[data-side='save'] {
        left: auto;
        right: 12px;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #66b5ff;
        outline-offset: 2px;
      }
      @media (max-width: 600px) {
        body {
          grid-template-rows: minmax(282px, 55%) minmax(0, 1fr) 70px;
        }
        #editor-container {
          display: grid;
          grid-template-columns: 1fr;
          grid-template-rows: repeat(3, minmax(0, 1fr));
          gap: 8px;
          padding: 8px 12px;
        }
        .editor {
          margin: 0;
        }
        textarea {
          height: 82px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        button:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <p id="keyboard-help" class="sr-only">
      Tab kodu tamamlar. Alandan çıkmak için Escape ardından Tab veya Shift+Tab
      kullanın.
    </p>
    <div id="editor-container">
      <div class="editor">
        <h3 id="html-label">HTML</h3>
        <textarea
          id="html-code"
          aria-labelledby="html-label"
          spellcheck="false"
          aria-describedby="keyboard-help"
          placeholder="HTML Kodu"
        ></textarea>
      </div>
      <div class="editor">
        <h3 id="css-label">CSS</h3>
        <textarea
          id="css-code"
          aria-labelledby="css-label"
          spellcheck="false"
          aria-describedby="keyboard-help"
          placeholder="CSS Kodu"
        ></textarea>
      </div>
      <div class="editor">
        <h3 id="js-label">JavaScript</h3>
        <textarea
          id="js-code"
          aria-labelledby="js-label"
          spellcheck="false"
          aria-describedby="keyboard-help"
          placeholder="JS Kodu"
        ></textarea>
      </div>
    </div>

    <div id="preview-container">
      <iframe
        id="preview"
        title="Canlı kod ön izlemesi"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>

    <!-- Footer -->
    <footer>
      <button
        id="load-btn"
        type="button"
        aria-label="Dosya Yükle"
        aria-describedby="file-notice"
      >
        📂
      </button>
      &copy; İlhan Kılıç
      <p id="file-notice" role="status" hidden></p>
      <button
        id="save-btn"
        type="button"
        aria-label="Dosyayı indir"
        aria-describedby="file-notice"
      >
        💾
      </button>
    </footer>

    <script>
      const htmlInput = document.getElementById('html-code');
      const cssInput = document.getElementById('css-code');
      const jsInput = document.getElementById('js-code');
      const previewFrame = document.getElementById('preview');
      const language =
        new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'tr';
      document.documentElement.lang = language;
      document.title =
        language === 'en'
          ? 'HCJEditor — Live Code Editor'
          : 'HCJEditor — Canlı Kod Editör';
      previewFrame.title =
        language === 'en' ? 'Live code preview' : 'Canlı kod ön izlemesi';
      document.getElementById('keyboard-help').textContent =
        language === 'en'
          ? 'Tab completes code. Press Escape then Tab or Shift+Tab to leave the editor.'
          : 'Tab kodu tamamlar. Alandan çıkmak için Escape ardından Tab veya Shift+Tab kullanın.';
      [htmlInput, cssInput, jsInput].forEach((input, index) => {
        input.placeholder = `${['HTML', 'CSS', 'JS'][index]} ${language === 'en' ? 'code' : 'Kodu'}`;
      });
      const fileNotice = document.getElementById('file-notice');
      for (const [id, side, label] of [
        ['load-btn', 'load', language === 'en' ? 'Open file' : 'Dosya Yükle'],
        ['save-btn', 'save', language === 'en' ? 'Save file' : 'Dosyayı indir'],
      ]) {
        const button = document.getElementById(id);
        button.setAttribute('aria-label', label);
        const showNotice = () => {
          fileNotice.dataset.side = side;
          fileNotice.textContent =
            language === 'en'
              ? 'File operations are disabled in this demo.'
              : 'Bu demoda dosya işlemleri devre dışı.';
          fileNotice.hidden = false;
        };
        const hideNotice = () => {
          fileNotice.hidden = true;
        };
        button.addEventListener('pointerenter', showNotice);
        button.addEventListener('pointerleave', (event) => {
          if (
            event.pointerType !== 'touch' &&
            document.activeElement !== button
          )
            hideNotice();
        });
        button.addEventListener('focus', showNotice);
        button.addEventListener('blur', hideNotice);
        button.addEventListener('click', () => {
          button.focus({ preventScroll: true });
          showNotice();
        });
        button.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') hideNotice();
        });
      }

      // The original editor's controls are retained; user code runs in an opaque child.
      const previewPolicy =
        "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
      function updatePreview() {
        // Assemble only a string here: parsing untrusted HTML with DOMParser can
        // fetch image URLs before its preview CSP is installed.
        const css = cssInput.value.replace(/<\/style/gi, '<\\/style');
        const js = jsInput.value.replace(/<\/script/gi, '<\\/script');
        previewFrame.srcdoc = `<!doctype html><html lang="${language}"><head>
          <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="${previewPolicy}">
          <style>${css}</style></head><body>${htmlInput.value}<script>${js}<\/script></body></html>`;
      }

      // Edits live in memory only: no access to the portfolio's persistent storage.
      for (const input of [htmlInput, cssInput, jsInput])
        input.addEventListener('input', updatePreview);
      updatePreview();

      // ENTER & TAB tuşlarına basınca olacak event
      function handleKeyDown(event) {
        const textarea = event.target;
        if (event.key === 'Escape') {
          textarea.dataset.releaseTab = 'true';
          return;
        }
        if (
          event.key === 'Tab' &&
          (event.shiftKey || textarea.dataset.releaseTab === 'true')
        ) {
          delete textarea.dataset.releaseTab;
          return;
        }

        if (event.key === 'Tab') {
          event.preventDefault();
          handleTabShortcut(event);
        } else if (event.key === 'Enter') {
          event.preventDefault();
          handleEnterKey(textarea);
        }
      }

      htmlInput.addEventListener('keydown', handleKeyDown);
      cssInput.addEventListener('keydown', handleKeyDown);
      jsInput.addEventListener('keydown', handleKeyDown);

      // Enter tuşuna basınca oluşacak event
      function handleEnterKey(textarea) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;

        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const currentLine = value.substring(lineStart, start);

        const indentationMatch = currentLine.match(/^\s*/);
        const indentation = indentationMatch ? indentationMatch[0] : '';
        let newIndentation = indentation;

        const trimmed = currentLine.trim();

        // Self-closing tag listesi
        const selfClosingTags = ['br', 'img', 'input', 'link', 'meta', 'hr'];

        // Eğer satır self-closing tag içeriyorsa, sadece yeni satır aç (girinti yok)
        // Örneğin: <input type="text" />
        for (const tag of selfClosingTags) {
          const regexSelfClosing = new RegExp(`^<${tag}[^>]*\\/?>$`, 'i');
          if (regexSelfClosing.test(trimmed)) {
            insertPlainNewline(textarea, indentation);
            return;
          }
        }

        // Eğer satır tamamen boş çift tag ise (ör: <div></div>)
        const emptyInlinePairMatch = trimmed.match(
          /^<([a-zA-Z][\w-]*)[^>]*>\s*<\/\1>$/,
        );
        if (emptyInlinePairMatch) {
          const tagName = emptyInlinePairMatch[1];
          const before = value.substring(0, start);
          const after = value.substring(end);

          const indentInside = indentation + '  ';
          const insertText =
            '\n' + indentInside + '\n' + indentation + `</${tagName}>`;

          textarea.value = before + insertText + after;
          textarea.selectionStart = textarea.selectionEnd =
            before.length + 1 + indentInside.length;

          updatePreview();
          return;
        }

        // Eğer satırda sadece kapanış etiketi varsa
        if (/^<\/[a-zA-Z][\w-]*>$/.test(trimmed)) {
          insertPlainNewline(textarea, indentation);
          return;
        }

        // Eğer satırda sadece açılış etiketi varsa (HTML için)
        if (textarea.id === 'html-code') {
          const openTagMatch = trimmed.match(/^<([a-zA-Z][\w-]*)[^>]*>$/);
          if (openTagMatch) {
            const tagName = openTagMatch[1];
            const before = value.substring(0, start);
            const after = value.substring(end);

            const indentInside = indentation + '  ';
            const insertText = '\n' + indentInside + '\n';

            textarea.value = before + insertText + after;
            textarea.selectionStart = textarea.selectionEnd =
              before.length + 1 + indentInside.length;

            updatePreview();
            return;
          }
        }

        // CSS için: { varsa içeri gir
        if (textarea.id === 'css-code' && trimmed.endsWith('{')) {
          newIndentation += '  ';
          const before = value.substring(0, start);
          const after = value.substring(end);

          const closingLine = indentation + '}';
          const insertText = '\n' + newIndentation + '\n' + closingLine;

          textarea.value = before + insertText + after;
          textarea.selectionStart = textarea.selectionEnd =
            before.length + 1 + newIndentation.length;

          updatePreview();
          return;
        }

        // Diğer her şeyde → sadece düz yeni satır
        insertPlainNewline(textarea, indentation);
      }

      //Yeni satır yardımcısı
      function insertPlainNewline(textarea, indentation) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        const before = value.substring(0, start);
        const after = value.substring(end);
        const insertText = '\n' + indentation;
        textarea.value = before + insertText + after;
        const cursorPos = before.length + insertText.length;
        textarea.selectionStart = textarea.selectionEnd = cursorPos;
        updatePreview();
      }

      // Tab tuşuna basınca oto düzenlenen özellikler
      function handleTabShortcut(event) {
        const textarea = event.target;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;

        const before = value.substring(0, start);
        const after = value.substring(end);

        const lineStart = before.lastIndexOf('\n') + 1;
        const currentLine = before.substring(lineStart);

        const indentationMatch = currentLine.match(/^\s*/);
        const indentation = indentationMatch ? indentationMatch[0] : '';

        const wordMatch = currentLine.match(/(\S+)$/);

        if (wordMatch) {
          const token = wordMatch[1];

          const specialAttributes = {
            a: ' href="" target="_blank"',
            img: ' src="" alt=""',
            input: ' type="text" id="" name=""',
            form: ' action="" method=""',
            link: ' rel="" href=""',
            script: ' src=""',
            meta: ' charset=""',
            button: ' type=""',
            textarea: '',
            select: '',
            label: ' for=""',
          };

          let tag = 'div';
          let className = '';
          let idName = '';

          const tagMatch = token.match(/^([a-zA-Z][\w-]*)/);
          if (tagMatch) tag = tagMatch[1];

          const classMatch = token.match(/\.([\w-]+)/);
          if (classMatch) className = classMatch[1];

          const idMatch = token.match(/#([\w-]+)/);
          if (idMatch) idName = idMatch[1];

          let attributes = '';
          if (className) attributes += ` class="${className}"`;
          if (idName) attributes += ` id="${idName}"`;
          if (specialAttributes[tag]) attributes += specialAttributes[tag];

          const selfClosingTags = ['img', 'input', 'link', 'meta'];
          let replacement = '';

          if (selfClosingTags.includes(tag.toLowerCase())) {
            replacement = `<${tag}${attributes} />`;
          } else {
            replacement = `<${tag}${attributes}></${tag}>`;
          }

          const newBefore =
            before.substring(0, before.length - token.length) + replacement;
          let newCursor = newBefore.length;

          if (!selfClosingTags.includes(tag.toLowerCase())) {
            newCursor -= `</${tag}>`.length;
          }

          textarea.value = newBefore + after;
          textarea.selectionStart = textarea.selectionEnd = newCursor;
        } else {
          const tabSize = 2;
          const spaces = ' '.repeat(tabSize);
          textarea.value = before + spaces + after;
          textarea.selectionStart = textarea.selectionEnd = start + tabSize;
        }

        updatePreview();
      }
    </script>
  </body>
</html>
